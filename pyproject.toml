[project]
name = "django-backblaze-b2"
version = "8.1.0"
description = "A Django app to use backblaze b2 as storage."
authors = [{name = "Etienne H", email = "django_backblaze_b2@internet-e-mail.com"}]
maintainers = [{name = "Etienne H", email = "django_backblaze_b2@internet-e-mail.com"}]
license = "BSD-2-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["django", "storage", "backblaze", "b2", "cloud"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "b2sdk>=2.0.0,<3.0.0",
    "django>=3.2",
    "typing-extensions>=4.0.1,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/ehossack/django-backblaze-b2/"
Repository = "https://github.com/ehossack/django-backblaze-b2/"

[dependency-groups]
dev = [
    "django>=5.2.8,<5.3",
    "django-stubs>=5.2,<6.0",
    "pytest>=8.4,<9.0",
    "mypy>=1.18,<2",
    "pytest-cov>=4.1,<7.0",
    "pytest-django>=4.11,<5.0",
    "docutils>=0.20,<0.22",
    "toml>=0.10.2,<0.11.0",
    "ruff>=0.5.0,<1.0.0",
    "types-toml>=0.10.8.20240310,<0.11.0",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
exclude = [".git", ".venv", "__pycache__", ".mypy_stubs"]
line-length = 120

[tool.ruff.lint]
ignore = []
select = ["C9", "E", "F", "I", "N", "W"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/test_project/django_project/settings.py" = ["F841"]
