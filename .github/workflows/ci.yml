name: CI
on: workflow_dispatch
permissions:
  contents: read

jobs:
  benchmark:
    if: github.ref == 'refs/heads/benchmark/pr-312-live'
    environment: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 560eb04fbb8cf082a7d1912c0614f05869e22a39
          path: base
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 19e8c0c794a79757fac5d449de927db38cce69d0
          path: head
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.10"
          python-version: "3.14"
      - run: uv sync --locked --python 3.14
      - name: Compare live B2 downloads
        env:
          TEST_BUCKET: ${{ secrets.TEST_BUCKET }}
          TEST_BACKBLAZE_APPLICATION_KEY_ID: ${{ secrets.TEST_BACKBLAZE_APPLICATION_KEY_ID }}
          TEST_BACKBLAZE_APPLICATION_KEY: ${{ secrets.TEST_BACKBLAZE_APPLICATION_KEY }}
        run: .venv/bin/python .github/scripts/live_benchmark.py
      - name: Report memory samples
        run: cat .github/scripts/results.jsonl
